[["Model de seră inteligentă",`# Sera mea inteligenta\nTEMP_MIN = 15\nnume_sera = "Sera lui Pixel"\ntemp = int(input("Temperatura azi? "))\nplouat = False\nprint("Raport:", nume_sera)\nprint("Temperatura:", temp)\nif temp < TEMP_MIN and not plouat:\n    print("Pornesc incalzirea!")\nprint("Sera este gata pentru azi!")`,"La 12 grade: Raport: Sera lui Pixel / Temperatura: 12 / Pornesc incalzirea! / Sera este gata pentru azi!"]]];
function exs(i){return `<div class="box"><h3>🔍 Exemple rezolvate</h3>`+EX[i].map((x,j)=>`<p><b>${j+1}. ${x[0]}</b></p><pre>${esc(x[1])}</pre><div class="note">▶ ${esc(x[2])}</div>`).join("")+`</div>`}
let cur=0,S={},A={},name="";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mx=t=>t.cr?t.cr.reduce((a,c)=>a+c[2],0):t.p;
const mm=m=>M[m].k.reduce((a,t)=>a+mx(t),0);
const got=m=>M[m].k.reduce((a,t,i)=>a+((S[m+"_"+i]||{}).pts||0),0);
const TOT=M.reduce((a,_,m)=>a+mm(m),0);
const tot=()=>M.reduce((a,_,m)=>a+got(m),0);
function grade(p){return p>=.9?"Foarte bine":p>=.7?"Bine":p>=.5?"Suficient":"Insuficient"}
function hdr(){const t=tot();document.getElementById("sc").textContent="⭐ "+t+" / "+TOT+" p · "+grade(t/TOT);document.getElementById("pb").style.width=(100*t/TOT)+"%";
document.getElementById("tabs").innerHTML=M.map((m,i)=>`<button class="tab ${i==cur?"on":""}" onclick="go(${i})">${m.e} ${i+1}. ${m.t}<small>${got(i)}/${mm(i)} p</small></button>`).join("")}
function card(m,i){const t=M[m].k[i],k=m+"_"+i,s=S[k];let h=`<span class="pt">${mx(t)} p</span><h3>Sarcina ${i+1}${t.cr?" · cod":""}</h3><p>${t.q}</p>`;
if(!t.cr){h+=t.o.map((o,j)=>`<button class="opt ${s?(j==t.a?"ok":(s.a==j?"no":"")):""}" ${s?"disabled":""} onclick="pick(${m},${i},${j})">${esc(o)}</button>`).join("");
if(s)h+=`<div class="res">${s.pts?"✔ Corect! +"+s.pts+" p":"✘ Răspunsul corect: "+esc(t.o[t.a])}</div>`}
else{h+=`<div class="note">Ce trebuie să conțină codul tău:</div><ul class="cr">`+t.cr.map((c,j)=>`<li class="${s?(s.ok[j]?"ok":"no"):""}">${s?(s.ok[j]?"✔":"✘"):"☐"} ${c[0]} <i>(${c[2]} p)</i></li>`).join("")+`</ul><textarea spellcheck="false" placeholder="${esc(t.ph)}" oninput="A['${k}']=this.value">${esc(A[k]||"")}</textarea><button class="go" onclick="chk(${m},${i})">✅ Verifică codul</button>`+(s?`<div class="res">Ai obținut ${s.pts} din ${mx(t)} p. ${s.pts<mx(t)?"Poți corecta codul și verifica din nou!":"Felicitări! 🎉"}</div>`:"")}
return h}
function paint(m,i){document.getElementById("c"+i).innerHTML=card(m,i);hdr()}
function pick(m,i,j){const k=m+"_"+i;if(S[k])return;const t=M[m].k[i];S[k]={a:j,pts:j==t.a?t.p:0};paint(m,i)}
function chk(m,i){const k=m+"_"+i,t=M[m].k[i],c=A[k]||"";const ok=t.cr.map(r=>(c.match(new RegExp(r[1].source,"gim"))||[]).length>=(r[3]||1));
S[k]={ok,pts:t.cr.reduce((a,r,j)=>a+(ok[j]?r[2]:0),0)};paint(m,i)}
function go(i){cur=i;show();scrollTo(0,0)}
function show(){const m=M[cur];document.getElementById("v").innerHTML=`<div class="pix"><div class="av">🤖</div><div class="bub"><b>Pixel spune:</b><br>${m.p}</div></div><div class="box"><h3>${m.e} Lecția ${cur+1} – ${m.t} (${m.s})</h3>${m.th}<div class="note">💻 Poți testa codul și online, pe programiz.ro/python.</div></div>`+exs(cur)+m.k.map((_,i)=>`<div class="card" id="c${i}">${card(cur,i)}</div>`).join("")+`<div class="nx"><button class="go" ${cur?"":"disabled"} onclick="go(${cur-1})">← Înapoi</button><button class="go" ${cur<M.length-1?"":"disabled"} onclick="go(${cur+1})">Lecția următoare →</button></div>`;hdr()}
function rep(){const t=tot();let h=`<meta charset="utf-8"><body style="font-family:sans-serif;max-width:800px;margin:auto"><h1>🌱 Sera lui Pixel – Rezultate</h1><p><b>Elev:</b> ${esc(name||"—")} · <b>Data:</b> ${new Date().toLocaleDateString("ro-RO")}</p><h2>Total: ${t} / ${TOT} p – ${grade(t/TOT)}</h2>`;
M.forEach((m,mi)=>{h+=`<h3>${m.e} Lecția ${mi+1}: ${m.t} – ${got(mi)}/${mm(mi)} p</h3>`;m.k.forEach((x,i)=>{const k=mi+"_"+i,s=S[k];h+=`<p>Sarcina ${i+1}: ${s?s.pts:0}/${mx(x)} p`+(x.cr&&A[k]?`</p><pre style="background:#eee;padding:8px">${esc(A[k])}</pre>`:`</p>`)})});return h+"</body>"}
async function dl(){const d=window.claude&&await claude.use("downloads");if(!d){alert("Descărcarea nu este disponibilă în această fereastră.");return}
try{await d.save({filename:"rezultate_"+(name||"elev").replace(/\W+/g,"_")+".html",data:new Blob([rep()],{type:"text/html"})})}catch(e){}}
show();
</script></body></html>
